[package]
name = "clipboard-macos-check"
version = "0.0.0"
edition = "2021"
[lib]
path = "lib.rs"
[dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSEnumerator"] }
image = { version = "0.25.10", default-features = false, features = ["png", "tiff"] }
url = "2"

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CLI-Manager 原生供应商管理高保真原型</title>
  <desc id="desc">Claude Code 供应商管理页，展示全局供应商、手动多 Key、配置继承、环境检查和 CC Switch 导入。</desc>
  <defs>
    <style>
      .ui { font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; fill: #f8fafc; }
      .mono { font-family: "Cascadia Code", "JetBrains Mono", monospace; }
      .h1 { font-size: 24px; font-weight: 700; }
      .h2 { font-size: 16px; font-weight: 650; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .tiny { font-size: 11px; }
      .muted { fill: #94a3b8; }
      .subtle { fill: #cbd5e1; }
      .primary { fill: #a78bfa; }
      .success { fill: #4ade80; }
      .warning { fill: #fbbf24; }
      .stroke { stroke: #334155; stroke-width: 1; }
      .icon { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
